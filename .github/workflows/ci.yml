name: frontend-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund
      - name: Capture npm lockfile for a reproducible dependency install
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const encoded = fs.readFileSync("package-lock.json").toString("base64");
          console.log("NPM_LOCKFILE_BASE64_BEGIN");
          for (let i = 0; i < encoded.length; i += 4000) console.log(encoded.slice(i, i + 4000));
          console.log("NPM_LOCKFILE_BASE64_END");
          NODE
      - name: Audit npm dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Build production frontend image
        run: docker build --tag service-agreement-manager-frontend:ci .
      - name: Smoke-test the production frontend container
        run: |
          docker run --detach --name sam-frontend-ci --publish 127.0.0.1:8080:80 service-agreement-manager-frontend:ci
          trap "docker rm --force sam-frontend-ci >/dev/null 2>&1 || true" EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -i "Content-Security-Policy"
          curl --fail --silent --head http://127.0.0.1:8080/reset-password | grep -i "X-Content-Type-Options"
          curl --fail --silent --output /dev/null "http://127.0.0.1:8080/reset-password?token=ci-smoke-test"
          docker exec sam-frontend-ci nginx -t
