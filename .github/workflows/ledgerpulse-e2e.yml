name: Service Agreement Manager walkthrough verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/testing/**"
      - "visual.md"
      - "WALKTHROUGH_PROGRESS.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/testing/**"
      - "visual.md"
      - "WALKTHROUGH_PROGRESS.md"
  workflow_dispatch:

concurrency:
  group: service-agreement-manager-walkthrough-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-api-e2e:
    name: Production frontend + PostgreSQL API + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service_agreements
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sam -d service_agreements"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sam:sam_test_password@localhost:5432/service_agreements
      APP_ENV: development
      JWT_SECRET_KEY: test-secret-with-more-than-32-characters-long
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:4173
      WEBHOOK_ENCRYPTION_KEY: test-webhook-encryption-key-2026-only
      NOTIFICATION_ENCRYPTION_KEY: test-notification-encryption-key-2026-only
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/service-agreement-manager-backend
          ref: main
          path: backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Install frontend dependencies and Playwright
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check migrated PostgreSQL schema against ORM
        working-directory: backend
        run: python -m alembic check

      - name: Run the complete backend test suite and lint
        working-directory: backend
        run: |
          mkdir -p ../test-results
          python -m ruff check .
          python -m pytest -ra --junitxml=../test-results/backend-pytest.xml

      - name: Run PostgreSQL payment and maintenance concurrency tests
        working-directory: backend
        env:
          RUN_PG_RACE_TESTS: "1"
        run: python -m pytest -ra tests/test_postgres_races.py --junitxml=../test-results/backend-postgres-races.xml

      - name: Start API and wait for database readiness
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          cd ..
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/health/ready"
          last_error = None
          for _ in range(45):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          break
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Backend readiness check failed: {last_error}")
          PY

      - name: Build the frontend production bundle against the local API
        env:
          VITE_API_URL: http://127.0.0.1:8000
          VITE_PUBLIC_REGISTRATION: "true"
        run: npm run build

      - name: Start the production frontend preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > frontend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:4173/"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          print(f"Frontend ready: HTTP {response.status}")
                          break
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"Frontend readiness check failed: {last_error}")
          PY

      - name: Run browser journeys and API integration checks
        run: npx playwright test --config=playwright.e2e.config.cjs

      - name: Upload screenshots, browser traces and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-agreement-manager-walkthrough-evidence
          path: |
            test-results/**
            playwright-report/**
            backend.log
            frontend.log
          if-no-files-found: warn
          retention-days: 14

  publish-visuals:
    if: ${{ needs.browser-api-e2e.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [browser-api-e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the tested main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download evidence from the successful browser run
        uses: actions/download-artifact@v4
        with:
          name: service-agreement-manager-walkthrough-evidence
          path: .visual-evidence

      - name: Publish the visitor walkthrough from successful screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -d .visual-evidence/test-results/screenshots
          test -f .visual-evidence/test-results/e2e-results.json
          mkdir -p docs/testing/visuals
          rm -f docs/testing/visuals/*.png
          cp .visual-evidence/test-results/screenshots/*.png docs/testing/visuals/

          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          docs = Path("docs/testing")
          visuals = docs / "visuals"
          source_sha = os.environ["SOURCE_SHA"]
          run_id = os.environ["SOURCE_RUN_ID"]
          repository = os.environ["SOURCE_REPOSITORY"]
          repository_url = f"https://github.com/{repository}"
          run_url = f"https://github.com/{repository}/actions/runs/{run_id}"
          result = json.loads(Path(".visual-evidence/test-results/e2e-results.json").read_text(encoding="utf-8"))
          stats = result.get("stats", {})
          browser_passed = int(stats.get("expected", 0))
          browser_failed = int(stats.get("unexpected", 0))
          browser_skipped = int(stats.get("skipped", 0))

          def junit_stats(file: Path):
              if not file.exists():
                  raise SystemExit(f"Required successful test report is missing: {file}")
              root = ET.parse(file).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              total = sum(int(s.attrib.get("tests", "0")) for s in suites)
              failed = sum(int(s.attrib.get("failures", "0")) + int(s.attrib.get("errors", "0")) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
              return {"total": total, "failed": failed, "skipped": skipped, "passed": max(0, total - failed - skipped)}

          backend = junit_stats(Path(".visual-evidence/test-results/backend-pytest.xml"))
          races = junit_stats(Path(".visual-evidence/test-results/backend-postgres-races.xml"))
          required = [
              "01-public-homepage.png",
              "02-login-invalid-credentials.png",
              "03-dashboard-after-registration.png",
              "04-customer-and-service-location.png",
              "05-agreement-draft.png",
              "06-agreement-active.png",
              "07-invoice-draft.png",
              "08-invoice-paid.png",
              "09-equipment-created.png",
              "10-service-catalog-created.png",
              "11-work-order-completed.png",
              "12-recurring-billing-active.png",
              "13-reports-and-csv-exports.png",
              "14-customer-import-recovery.png",
              "15-email-queued.png",
              "16-sms-provider-disabled.png",
              "17-branch-hours-and-closures.png",
              "18-maintenance-plan-generation.png",
              "19-invoice-partially-paid.png",
              "20-integrations-webhooks.png",
              "21-session-after-logout.png",
              "22-password-reset-request.png",
              "23-password-reset-invalid-token.png",
              "24-email-verification-invalid-token.png",
              "25-invoice-adjustments-ui.png",
              "26-sign-in-screen.png",
              "27-create-workspace-form.png",
          ]
          missing = [name for name in required if not (visuals / name).is_file()]
          if missing:
              raise SystemExit("Refusing to publish an incomplete walkthrough. Missing screenshots: " + ", ".join(missing))
          screenshots = sorted(p.name for p in visuals.glob("*.png"))
          unexpected = [name for name in screenshots if name not in required]
          if unexpected:
              raise SystemExit("Unexpected screenshot files would make the published gallery ambiguous: " + ", ".join(unexpected))
          if browser_failed or browser_skipped:
              raise SystemExit(f"Refusing to publish unsuccessful browser evidence: {browser_passed} passed, {browser_failed} failed, {browser_skipped} skipped")

          template_path = Path(".github/visual.md.template")
          template = template_path.read_text(encoding="utf-8")
          template = template.replace("__TESTED_SHA__", source_sha)
          template = template.replace("__REPOSITORY__", repository)
          template = template.replace("__RUN_ID__", run_id)
          template = template.replace("__RUN_URL__", run_url)
          Path("visual.md").write_text(template.rstrip() + "\n", encoding="utf-8")

          report = f"""# Walkthrough verification record

          **Result:** PASS
          **Project source commit:** [{source_sha}]({repository_url}/commit/{source_sha})
          **Workflow run:** [Run #{run_id}]({run_url})
          **Browser journeys:** {browser_passed} passed, {browser_failed} failed, {browser_skipped} skipped
          **Screenshots published:** {len(screenshots)}
          **Backend pytest:** {backend['passed']} passed, {backend['failed']} failed/errors, {backend['skipped']} skipped
          **PostgreSQL concurrency tests:** {races['passed']} passed, {races['failed']} failed/errors, {races['skipped']} skipped

          This report records the automated evidence for the public [product walkthrough](../../visual.md). It is separate from the visitor-facing guide.

          ## Coverage and limits

          The browser run starts the backend from the backend repository's `main` branch, applies migrations to a disposable PostgreSQL 16 database, builds the frontend for production, serves the build locally and drives the major customer, agreement, operations, billing, reports, notifications, integration and account-recovery journeys through Chromium.

          All published images come from that successful run. Test records are synthetic. Email is verified at the outbox stage, SMS follows the disabled-provider path, and external provider delivery and hosted production connectivity are not claimed as verified. This is broad product-journey evidence, not an exhaustive sign-off for every role or edge case.
          """
          report = report.replace("          ", "")
          (docs / "TEST-REPORT.md").write_text(report.strip() + "\n", encoding="utf-8")
          (docs / "VISUAL-TEST-WALKTHROUGH.md").write_text(
              "# Product walkthrough\n\n"
              "The visitor-facing guided tour now lives in the repository root: [visual.md](../../visual.md). "
              "It presents the application through aligned screenshots and user-focused explanations. "
              "The automation evidence and scope limits are recorded in [TEST-REPORT.md](TEST-REPORT.md).\n",
              encoding="utf-8",
          )
          manifest = {
              "project": "Service Agreement Manager",
              "tested_source_commit": source_sha,
              "workflow_run_id": int(run_id),
              "workflow_run_url": run_url,
              "branch": "main",
              "browser": "Chromium / Playwright",
              "viewport": "1280x720 (full-page screenshots)",
              "successful_screenshot_count": len(screenshots),
              "successful_screenshots": screenshots,
              "browser_journeys_passed": browser_passed,
              "browser_journeys_failed": browser_failed,
              "browser_journeys_skipped": browser_skipped,
              "backend_test_count": backend["total"],
              "backend_test_passed": backend["passed"],
              "backend_test_failures_or_errors": backend["failed"],
              "backend_test_skipped": backend["skipped"],
              "postgres_concurrency_test_count": races["total"],
              "postgres_concurrency_test_passed": races["passed"],
              "postgres_concurrency_test_failures": races["failed"],
              "postgres_concurrency_test_skipped": races["skipped"],
              "historical_failure_screenshot_included": False,
          }
          (visuals / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          progress = f"""# Walkthrough Progress

          **Project:** Service Agreement Manager
          **State:** Complete for the recorded main-branch walkthrough run.
          **Target branch:** `main` in frontend and backend repositories. No task branch was created.
          **Canonical public walkthrough:** [`visual.md`](visual.md)
          **Screenshot directory:** [`docs/testing/visuals/`](docs/testing/visuals/)

          ## Completed and verified
          - Main-branch browser workflow passed: [Run #{run_id}]({run_url}).
          - Source revision exercised by the workflow: [{source_sha}]({repository_url}/commit/{source_sha}).
          - Browser journey result: {browser_passed} passed, 0 failed, 0 skipped.
          - Production frontend build and local production preview started successfully as part of the walkthrough.
          - Backend migrations, schema consistency, Ruff, full pytest and PostgreSQL concurrency checks passed in the same run.
          - {len(screenshots)} genuine screenshots were captured by Playwright after successful assertions and saved under `docs/testing/visuals/`.
          - `visual.md` was generated from the walkthrough template and linked only to screenshots that exist in the successful run.
          - Project-facing text uses Service Agreement Manager naming and guides visitors through the product's actual workflow.
          - Error discovered during recovery walkthrough was addressed by scrubbing reset/verification tokens with layout effects before the browser paints; the passing browser run verifies that interaction.

          ## Recorded verification
          | Area | Result |
          |---|---|
          | Browser user journeys | {browser_passed} passed, 0 failed, 0 skipped |
          | Backend pytest | {backend['passed']} passed, {backend['failed']} failed/errors, {backend['skipped']} skipped |
          | PostgreSQL concurrency | {races['passed']} passed, {races['failed']} failed/errors, {races['skipped']} skipped |
          | Screenshots and image paths | {len(screenshots)} present and checked before publication |
          | Hosted production deployment | Not verified by this local integration run |
          | Live SMTP/SMS/external webhook delivery | Not verified; external provider credentials and recipients are outside this run |

          ## Remaining limitations
          This run proves the isolated repository integration journey, not that the hosted site or every production provider/role is configured. The images use synthetic data. Email enqueueing, the SMS provider-disabled response and webhook endpoint management are shown without claiming actual external delivery. See [the verification record](docs/testing/TEST-REPORT.md) for scope details.
          """
          progress = progress.replace("          ", "")
          Path("WALKTHROUGH_PROGRESS.md").write_text(progress.strip() + "\n", encoding="utf-8")
          print(json.dumps({
              "project": "Service Agreement Manager",
              "source_commit": source_sha,
              "workflow_run_id": int(run_id),
              "browser_passed": browser_passed,
              "screenshots": screenshots,
              "backend": backend,
              "postgres_concurrency": races,
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing visual.md WALKTHROUGH_PROGRESS.md
          if git diff --cached --quiet; then
            echo "Curated visual evidence is already current; no commit needed."
          else
            git commit -m "docs(testing): publish visual evidence for ${SOURCE_SHA:0:7} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
